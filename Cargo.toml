[package]
name = "monarch-todo"
version = "0.1.2"
edition = "2021"
description = "Fast TUI todo manager for Monarch (shares the monarch todo JSON store)"
authors = ["y0no"]
license = "MIT"

[[bin]]
name = "monarch-todo"
path = "src/main.rs"

[dependencies]
# TUI — pinned to the same versions as monarch-lazyvpn
ratatui = "0.26"
crossterm = "0.27"

# Store
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
anyhow = "1"
rand = "0.8"
unicode-width = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
