[package]
name = "monarch-todo"
version = "0.2.0"
edition = "2021"
description = "Task and reminder backend for Monarch"
authors = ["y0no"]
license = "MIT"

[[bin]]
name = "monarch-todo"
path = "src/main.rs"

[dependencies]
# Store
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
interim = { version = "0.2.1", features = ["chrono_0_4"] }
fs2 = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Misc
anyhow = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
